<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F4F6F9">
  <title>Japan Winter Tour 2026</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Japan Winter 2026">

  <link rel="apple-touch-icon" sizes="180x180" href="./sakura.png">
  <link rel="icon" type="image/png" href="./sakura.png">

  <!-- SheetJS -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    @font-face {
      font-family: 'Aptos';
      src: local('Aptos'),
           local('Aptos Display'),
           url('https://cdn.jsdelivr.net/gh/idursun/aptos-font@main/Aptos.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Aptos';
      src: local('Aptos-SemiBold'),
           url('https://cdn.jsdelivr.net/gh/idursun/aptos-font@main/Aptos-SemiBold.ttf') format('truetype');
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Aptos';
      src: local('Aptos-Bold'),
           local('Aptos Display Bold'),
           url('https://cdn.jsdelivr.net/gh/idursun/aptos-font@main/Aptos-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --primary: #8E2944;
      --primary-deep: #731D35;
      --primary-bright: #AF3657;
      --primary-soft: rgba(255, 240, 244, 0.72);
      --primary-border: rgba(182, 72, 101, 0.16);

      --bg: #EEF2F6;
      --bg-2: #F8FAFC;
      --text-main: #0F172A;
      --text-sub: #64748B;
      --text-soft: #94A3B8;

      --glass-bg:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.84) 0%,
          rgba(255, 255, 255, 0.62) 48%,
          rgba(255, 255, 255, 0.48) 100%
        );

      --glass-strong:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.93) 0%,
          rgba(255, 255, 255, 0.72) 54%,
          rgba(255, 255, 255, 0.58) 100%
        );

      --glass-border: rgba(255, 255, 255, 0.82);
      --glass-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.96),
        inset 0 -1px 0 rgba(15, 23, 42, 0.02),
        0 16px 40px -18px rgba(15, 23, 42, 0.22),
        0 4px 14px rgba(15, 23, 42, 0.04);

      --glass-shadow-soft:
        inset 0 1px 0 rgba(255, 255, 255, 0.92),
        0 10px 28px -16px rgba(15, 23, 42, 0.18),
        0 2px 8px rgba(15, 23, 42, 0.035);

      --blur: blur(24px) saturate(175%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Aptos', -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    }

    html {
      scroll-behavior: smooth;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px));
      color: var(--text-main);
      background:
        radial-gradient(circle at 8% 2%, rgba(192, 74, 111, 0.10) 0, transparent 24%),
        radial-gradient(circle at 92% 12%, rgba(96, 165, 250, 0.12) 0, transparent 28%),
        radial-gradient(circle at 50% 82%, rgba(255, 255, 255, 0.92) 0, transparent 36%),
        linear-gradient(180deg, #F6F8FB 0%, #EDF2F7 52%, #F7F9FC 100%);
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
      position: relative;
      isolation: isolate;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      pointer-events: none;
      z-index: -1;
      filter: blur(26px);
      opacity: 0.9;
      border-radius: 999px;
    }

    body::before {
      width: 180px;
      height: 180px;
      top: 110px;
      left: -76px;
      background: rgba(188, 69, 104, 0.08);
    }

    body::after {
      width: 220px;
      height: 220px;
      right: -105px;
      top: 42vh;
      background: rgba(59, 130, 246, 0.08);
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    /* =========================
       HEADER
    ========================= */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding:
        calc(env(safe-area-inset-top, 0px) + 10px)
        14px
        7px;
      background: linear-gradient(
        180deg,
        rgba(244, 247, 250, 0.86) 0%,
        rgba(244, 247, 250, 0.66) 72%,
        rgba(244, 247, 250, 0.18) 100%
      );
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
    }

    .header-island {
      max-width: 520px;
      margin: 0 auto;
      min-height: 58px;
      padding: 10px 12px 10px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid var(--glass-border);
      border-radius: 22px;
      background: var(--glass-strong);
      box-shadow: var(--glass-shadow);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      position: relative;
      overflow: hidden;
    }

    .header-island::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(
          120deg,
          rgba(255,255,255,0.58) 0%,
          rgba(255,255,255,0.14) 32%,
          transparent 56%
        );
    }

    .header-info,
    .header-actions {
      position: relative;
      z-index: 1;
    }

    .header-info {
      min-width: 0;
    }

    .header-subtext {
      font-size: 9.5px;
      font-weight: 700;
      color: var(--text-soft);
      text-transform: uppercase;
      letter-spacing: 0.9px;
      line-height: 1.1;
    }

    .header-title {
      margin-top: 3px;
      color: var(--primary);
      font-size: 16.5px;
      font-weight: 700;
      letter-spacing: 0.15px;
      line-height: 1.15;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    .sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 30px;
      padding: 6px 10px;
      border: 1px solid rgba(255,255,255,0.86);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.56);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.9),
        0 2px 7px rgba(15,23,42,0.04);
      color: #556173;
      font-size: 10.5px;
      font-weight: 600;
      white-space: nowrap;
    }

    .status-dot {
      width: 6.5px;
      height: 6.5px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 0 4px rgba(142, 41, 68, 0.08);
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .refresh-btn {
      width: 34px;
      height: 34px;
      border: 1px solid rgba(255,255,255,0.92);
      border-radius: 50%;
      display: grid;
      place-items: center;
      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,0.96) 0%,
          rgba(247,249,252,0.76) 100%
        );
      box-shadow:
        inset 0 1px 0 #fff,
        0 3px 9px rgba(15,23,42,0.055);
      color: var(--primary);
      font-size: 17px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      transition:
        transform .18s ease,
        background .18s ease,
        opacity .18s ease;
    }

    .refresh-btn:active {
      transform: scale(0.92);
      background: var(--primary-soft);
    }

    .refresh-btn:disabled {
      opacity: 0.62;
      cursor: default;
    }

    .refresh-btn.is-syncing {
      animation: spin .9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* =========================
       FULLSCREEN COUNTDOWN LANDING
       Liquid Glass + Animated Waves
    ========================= */
    .countdown-wrapper {
      width: 100%;
      min-height: 100svh;
      padding:
        calc(env(safe-area-inset-top, 0px) + 22px)
        18px
        calc(env(safe-area-inset-bottom, 0px) + 24px);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      scroll-snap-align: start;
      background:
        radial-gradient(circle at 20% 18%, rgba(255,255,255,0.54) 0%, transparent 22%),
        radial-gradient(circle at 82% 24%, rgba(214,231,255,0.42) 0%, transparent 26%),
        radial-gradient(circle at 50% 70%, rgba(255,244,247,0.58) 0%, transparent 34%),
        linear-gradient(180deg, #E9EDF2 0%, #DEE4EA 100%);
      isolation: isolate;
      transition: opacity .42s ease, transform .42s ease;
    }

    .countdown-wrapper.is-leaving {
      opacity: 0.96;
      transform: scale(0.992);
    }

    .countdown-wrapper::before,
    .countdown-wrapper::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(28px);
      pointer-events: none;
      z-index: 0;
    }

    .countdown-wrapper::before {
      width: 280px;
      height: 280px;
      top: -100px;
      left: -110px;
      background: rgba(255,255,255,0.34);
    }

    .countdown-wrapper::after {
      width: 240px;
      height: 240px;
      right: -100px;
      bottom: 14%;
      background: rgba(171, 86, 111, 0.06);
    }

    .wave-scene {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .liquid-orb {
      position: absolute;
      border-radius: 50%;
      background:
        radial-gradient(circle at 32% 28%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.35) 34%, rgba(255,255,255,0.10) 62%, transparent 76%);
      border: 1px solid rgba(255,255,255,0.32);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.42),
        0 16px 35px rgba(255,255,255,0.10);
      filter: blur(1px);
      animation: orbFloat 14s ease-in-out infinite alternate;
    }

    .orb-a {
      width: 180px;
      height: 180px;
      top: 10%;
      right: 8%;
      opacity: 0.55;
      animation-duration: 17s;
    }

    .orb-b {
      width: 120px;
      height: 120px;
      left: 10%;
      bottom: 26%;
      opacity: 0.48;
      animation-duration: 13s;
    }

    .orb-c {
      width: 82px;
      height: 82px;
      left: 22%;
      top: 24%;
      opacity: 0.35;
      animation-duration: 11s;
    }

    @keyframes orbFloat {
      0%   { transform: translate3d(0, 0, 0); }
      50%  { transform: translate3d(10px, -10px, 0); }
      100% { transform: translate3d(-8px, 14px, 0); }
    }

    .wave {
      position: absolute;
      left: -8%;
      width: 116%;
      height: auto;
      opacity: 0.95;
      transform: translate3d(0,0,0);
      will-change: transform;
      filter: drop-shadow(0 -6px 18px rgba(255,255,255,0.18));
    }

    .wave path {
      vector-effect: non-scaling-stroke;
    }

    .wave-1 {
      bottom: 120px;
      opacity: 0.30;
      animation: waveDrift1 13s ease-in-out infinite alternate;
    }

    .wave-2 {
      bottom: 72px;
      opacity: 0.44;
      animation: waveDrift2 16s ease-in-out infinite alternate;
    }

    .wave-3 {
      bottom: -2px;
      opacity: 0.58;
      animation: waveDrift3 19s ease-in-out infinite alternate;
    }

    @keyframes waveDrift1 {
      0%   { transform: translateX(-2%) translateY(0); }
      100% { transform: translateX(2.5%) translateY(-6px); }
    }

    @keyframes waveDrift2 {
      0%   { transform: translateX(1.5%) translateY(0); }
      100% { transform: translateX(-2.5%) translateY(5px); }
    }

    @keyframes waveDrift3 {
      0%   { transform: translateX(-1.5%) translateY(0); }
      100% { transform: translateX(2%) translateY(-4px); }
    }

    .countdown-card {
      width: min(100%, 392px);
      min-height: 610px;
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.92);
      border-radius: 30px;
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.90) 0%,
          rgba(255,255,255,0.74) 56%,
          rgba(255,255,255,0.62) 100%
        );
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.98),
        inset 0 -1px 0 rgba(15,23,42,0.02),
        0 34px 80px -32px rgba(15,23,42,0.30),
        0 14px 28px rgba(15,23,42,0.07);
      backdrop-filter: blur(32px) saturate(185%);
      -webkit-backdrop-filter: blur(32px) saturate(185%);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      z-index: 1;
    }

    .countdown-card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(
          128deg,
          rgba(255,255,255,0.56) 0%,
          rgba(255,255,255,0.14) 28%,
          transparent 58%,
          rgba(255,255,255,0.12) 100%
        );
      z-index: 0;
    }

    .countdown-card::after {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: 29px;
      pointer-events: none;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.22);
      z-index: 0;
    }

    .countdown-header,
    .countdown-stage,
    .countdown-footer {
      position: relative;
      z-index: 1;
    }

    .countdown-header {
      min-height: 64px;
      padding: 10px 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .countdown-header-left {
      min-width: 0;
    }

    .countdown-eyebrow {
      color: var(--text-soft);
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.8px;
      line-height: 1;
      text-transform: uppercase;
    }

    .countdown-heading {
      margin-top: 5px;
      color: #111827;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.12;
      letter-spacing: -0.2px;
    }

    .departure-chip {
      flex-shrink: 0;
      padding: 6px 10px;
      border: 1px solid rgba(182, 72, 101, 0.16);
      border-radius: 999px;
      background: rgba(255,241,245,0.70);
      color: var(--primary);
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .countdown-stage {
      flex: 1;
      min-height: 430px;
      border: 1px solid rgba(255,255,255,0.56);
      border-radius: 25px;
      background:
        linear-gradient(
          145deg,
          rgba(255,240,244,0.74) 0%,
          rgba(255,231,238,0.58) 54%,
          rgba(255,239,243,0.44) 100%
        );
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.88),
        inset 0 -1px 0 rgba(142,41,68,0.02);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      backdrop-filter: blur(18px) saturate(155%);
      -webkit-backdrop-filter: blur(18px) saturate(155%);
    }

    .countdown-stage::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 28%, rgba(255,255,255,0.62) 0%, transparent 28%),
        linear-gradient(180deg, rgba(255,255,255,0.18) 0%, transparent 30%, transparent 74%, rgba(255,255,255,0.07) 100%);
    }

    .countdown-center {
      position: relative;
      z-index: 1;
      transform: translateY(-10px);
    }

    .countdown-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.96);
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.96) 0%,
          rgba(255,247,249,0.80) 100%
        );
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,1),
        0 12px 24px rgba(142,41,68,0.11);
      color: var(--primary);
      font-size: 28px;
      line-height: 1;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .countdown-trip-label {
      color: #5F4D53;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.1;
    }

    .countdown-days {
      margin-top: 8px;
      color: #111827;
      font-size: clamp(54px, 15vw, 70px);
      font-weight: 700;
      line-height: 0.9;
      letter-spacing: -2.5px;
      font-variant-numeric: tabular-nums;
    }

    .countdown-days-label {
      margin-top: 10px;
      color: #8A747B;
      font-size: 11px;
      font-weight: 600;
      line-height: 1;
    }

    .countdown-subtime {
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--primary);
      font-size: 11px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .countdown-subtime .sep {
      color: rgba(142,41,68,0.34);
      font-weight: 400;
    }

    .countdown-footer {
      min-height: 64px;
      padding: 14px 6px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #8A96A6;
      font-size: 9.7px;
      font-weight: 600;
    }

    .countdown-dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .countdown-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--primary);
      opacity: 0.9;
      box-shadow: 0 0 0 3px rgba(142,41,68,0.06);
    }

    .countdown-dot.muted {
      background: #CBD5E1;
      box-shadow: none;
      opacity: 1;
    }

    .tap-hint {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      color: #7C8797;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.02em;
      user-select: none;
    }

    .tap-hint-icon {
      display: inline-block;
      font-size: 12px;
      animation: tapPulse 1.8s ease-in-out infinite;
    }

    @keyframes tapPulse {
      0%, 100% { transform: translateY(0); opacity: 0.72; }
      50% { transform: translateY(3px); opacity: 1; }
    }

    /* =========================
       TABS
    ========================= */
    .tabs-bar-wrapper {
      position: sticky;
      top: calc(env(safe-area-inset-top, 0px) + 75px);
      z-index: 90;
      max-width: 548px;
      margin: 0 auto;
      padding: 4px 14px 10px;
      background:
        linear-gradient(
          180deg,
          rgba(241,245,249,0.66) 0%,
          rgba(241,245,249,0.40) 70%,
          rgba(241,245,249,0) 100%
        );
      backdrop-filter: blur(22px) saturate(170%);
      -webkit-backdrop-filter: blur(22px) saturate(170%);
    }

    .tabs-bar {
      position: relative;
      display: flex;
      gap: 6px;
      padding: 5px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
      border: 1px solid rgba(255,255,255,0.86);
      border-radius: 20px;
      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,0.70) 0%,
          rgba(255,255,255,0.45) 100%
        );
      box-shadow: var(--glass-shadow-soft);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .tabs-bar::-webkit-scrollbar {
      display: none;
    }

    .tab-card {
      flex-shrink: 0;
      min-width: 68px;
      padding: 7px 12px;
      border: 1px solid transparent;
      border-radius: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: transparent;
      transition:
        transform .2s cubic-bezier(.2,.8,.2,1),
        background .2s ease,
        box-shadow .2s ease;
      user-select: none;
    }

    .tab-card:active {
      transform: scale(0.96);
    }

    .tab-day-label {
      color: #475569;
      font-size: 12.5px;
      font-weight: 700;
      line-height: 1.1;
    }

    .tab-date-label {
      margin-top: 3px;
      color: #94A3B8;
      font-size: 9.5px;
      font-weight: 600;
      line-height: 1;
    }

    .tab-card.active {
      border-color: rgba(255,255,255,0.36);
      background:
        linear-gradient(
          180deg,
          #A43252 0%,
          #8E2944 58%,
          #7F223C 100%
        );
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.30),
        0 6px 16px rgba(142,41,68,0.28);
      transform: translateY(-1px);
    }

    .tab-card.active .tab-day-label {
      color: #FFFFFF;
    }

    .tab-card.active .tab-date-label {
      color: rgba(255,255,255,0.78);
    }

    /* =========================
       CONTENT
    ========================= */
    .content-box {
      max-width: 520px;
      margin: 0 auto;
      padding: 4px 14px 20px;
    }

    .day-banner {
      padding: 6px 4px 12px;
    }

    .day-banner-kicker {
      margin-bottom: 3px;
      color: var(--primary);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.75px;
      text-transform: uppercase;
    }

    .day-banner-title {
      color: #334155;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.35;
    }

    /* =========================
       TRAVEL CARD
    ========================= */
    .travel-card {
      position: relative;
      overflow: hidden;
      margin-bottom: 15px;
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.86);
      border-radius: 25px;
      background: var(--glass-bg);
      box-shadow: var(--glass-shadow);
      backdrop-filter: blur(24px) saturate(178%);
      -webkit-backdrop-filter: blur(24px) saturate(178%);
    }

    .travel-card::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(
          130deg,
          rgba(255,255,255,0.22) 0%,
          transparent 26%,
          transparent 76%,
          rgba(255,255,255,0.10) 100%
        );
    }

    .card-inner {
      position: relative;
      z-index: 1;
    }

    .card-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .soft-time-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border: 1px solid var(--primary-border);
      border-radius: 999px;
      background:
        linear-gradient(
          180deg,
          rgba(255,246,249,0.88) 0%,
          rgba(255,235,241,0.64) 100%
        );
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.92),
        0 2px 7px rgba(142,41,68,0.05);
      color: var(--primary);
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.05px;
    }

    .card-seq {
      color: #A3ADBC;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.55px;
      text-transform: uppercase;
    }

    .card-media {
      width: 100%;
      aspect-ratio: 16 / 9;
      margin-bottom: 13px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.72);
      border-radius: 19px;
      background: #E2E8F0;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.24),
        0 7px 18px rgba(15,23,42,0.07);
      position: relative;
    }

    .card-media::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
    }

    .card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .4s cubic-bezier(.2,.8,.2,1);
    }

    .travel-card:active .card-media img {
      transform: scale(1.012);
    }

    .card-body {
      padding: 0 3px 2px;
    }

    .card-title {
      margin-bottom: 6px;
      color: var(--text-main);
      font-size: 16.5px;
      font-weight: 700;
      line-height: 1.32;
      letter-spacing: -0.08px;
    }

    .card-desc {
      margin-bottom: 13px;
      color: var(--text-sub);
      font-size: 13.25px;
      font-weight: 400;
      line-height: 1.56;
    }

    .meta-pills {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .pill-link,
    .pill-note-only {
      max-width: 100%;
      min-height: 31px;
      padding: 7px 11px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 600;
      line-height: 1.2;
      text-decoration: none;
    }

    .pill-link {
      border: 1px solid rgba(255,255,255,0.92);
      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,0.92) 0%,
          rgba(248,250,252,0.68) 100%
        );
      box-shadow:
        inset 0 1px 0 #fff,
        0 2px 8px rgba(15,23,42,0.045);
      color: var(--primary);
      transition:
        transform .15s ease,
        background .15s ease;
    }

    .pill-link:active {
      transform: scale(0.97);
      background: var(--primary-soft);
    }

    .pill-note-only {
      border: 1px solid rgba(255,255,255,0.78);
      background: rgba(255,255,255,0.50);
      color: #526071;
    }

    /* =========================
       LOADING / EMPTY
    ========================= */
    .loading-stack {
      display: grid;
      gap: 14px;
      padding-top: 3px;
    }

    .skeleton-card {
      height: 230px;
      border: 1px solid rgba(255,255,255,0.76);
      border-radius: 25px;
      background:
        linear-gradient(
          100deg,
          rgba(255,255,255,0.44) 20%,
          rgba(255,255,255,0.78) 40%,
          rgba(255,255,255,0.44) 60%
        );
      background-size: 240% 100%;
      box-shadow: var(--glass-shadow-soft);
      animation: shimmer 1.25s ease-in-out infinite;
    }

    @keyframes shimmer {
      0% { background-position: 110% 0; }
      100% { background-position: -110% 0; }
    }

    .empty-state {
      padding: 56px 20px;
      text-align: center;
      color: var(--text-sub);
      font-size: 13px;
      line-height: 1.5;
    }

    /* =========================
       RESPONSIVE
    ========================= */
    @media (max-width: 390px) {
      .sync-pill {
        display: none;
      }

      .header-title {
        font-size: 16px;
      }

      .countdown-card {
        padding: 14px;
      }

      .countdown-card {
        min-height: min(610px, calc(100svh - 46px));
      }

      .countdown-stage {
        min-height: 390px;
      }

      .countdown-days {
        font-size: 56px;
      }

      .countdown-footer {
        font-size: 9.2px;
      }

      .travel-card {
        padding: 11px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.001ms !important;
      }
    }

    @supports not ((backdrop-filter: blur(10px)) or (-webkit-backdrop-filter: blur(10px))) {
      .header-island,
      .countdown-card,
      .tabs-bar,
      .travel-card {
        background: rgba(255,255,255,0.94);
      }
    }
  </style>
</head>

<body>
  <!-- Countdown Hero -->
  <section class="countdown-wrapper" id="countdownScreen" aria-label="Departure countdown" onclick="goToItinerary()">
    <div class="wave-scene" aria-hidden="true">
      <div class="liquid-orb orb-a"></div>
      <div class="liquid-orb orb-b"></div>
      <div class="liquid-orb orb-c"></div>

      <svg class="wave wave-1" viewBox="0 0 1440 320" preserveAspectRatio="none">
        <path fill="rgba(255,255,255,0.55)" d="M0,160L48,149.3C96,139,192,117,288,128C384,139,480,181,576,197.3C672,213,768,203,864,181.3C960,160,1056,128,1152,122.7C1248,117,1344,139,1392,149.3L1440,160L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
      </svg>

      <svg class="wave wave-2" viewBox="0 0 1440 320" preserveAspectRatio="none">
        <path fill="rgba(255,235,241,0.68)" d="M0,224L48,224C96,224,192,224,288,192C384,160,480,96,576,80C672,64,768,96,864,128C960,160,1056,192,1152,202.7C1248,213,1344,203,1392,197.3L1440,192L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
      </svg>

      <svg class="wave wave-3" viewBox="0 0 1440 320" preserveAspectRatio="none">
        <path fill="rgba(255,255,255,0.82)" d="M0,256L48,234.7C96,213,192,171,288,165.3C384,160,480,192,576,218.7C672,245,768,267,864,261.3C960,256,1056,224,1152,202.7C1248,181,1344,171,1392,165.3L1440,160L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
      </svg>
    </div>

    <div class="countdown-card">
      <div class="countdown-header">
        <div class="countdown-header-left">
          <div class="countdown-eyebrow">Japan Winter 2026</div>
          <div class="countdown-heading" id="countdownTitle">Departure countdown</div>
        </div>
        <div class="departure-chip">27 NOV 2026</div>
      </div>

      <div class="countdown-stage">
        <div class="countdown-center">
          <div class="countdown-icon" aria-hidden="true">✈</div>
          <div class="countdown-trip-label">Japan Trip</div>
          <div class="countdown-days" id="countDays">--</div>
          <div class="countdown-days-label">Days</div>

          <div class="countdown-subtime" aria-label="Hours minutes seconds">
            <span id="countHours">--</span>
            <span>h</span>
            <span class="sep">•</span>
            <span id="countMinutes">--</span>
            <span>m</span>
            <span class="sep">•</span>
            <span id="countSeconds">--</span>
            <span>s</span>
          </div>
        </div>
      </div>

      <div class="countdown-footer">
        <div class="countdown-dots" aria-hidden="true">
          <span class="countdown-dot"></span>
          <span class="countdown-dot muted"></span>
          <span class="countdown-dot muted"></span>
        </div>

        <div class="tap-hint">
          <span>Tap anywhere to continue</span>
          <span class="tap-hint-icon">↓</span>
        </div>
      </div>
    </div>
  </section>

  <!-- Floating Header -->
  <header id="itineraryStart">
    <div class="header-island">
      <div class="header-info">
        <div class="header-subtext">Winter Itinerary</div>
        <div class="header-title">JAPAN TOUR 2026</div>
      </div>

      <div class="header-actions">
        <div class="sync-pill" id="syncStatus">
          <span class="status-dot"></span>
          <span id="syncStatusText">Ready</span>
        </div>

        <button
          class="refresh-btn"
          id="syncBtn"
          type="button"
          aria-label="Sync itinerary"
          title="Sync itinerary"
          onclick="syncOnline(true)"
        >↻</button>
      </div>
    </div>
  </header>

  <!-- Tabs -->
  <div class="tabs-bar-wrapper">
    <div class="tabs-bar" id="tabsList" role="tablist" aria-label="Trip days"></div>
  </div>

  <!-- Content -->
  <main class="content-box">
    <div class="day-banner" id="dayBanner">
      <div class="day-banner-kicker">Today’s plan</div>
      <div class="day-banner-title" id="dayFullTitle"></div>
    </div>

    <div id="travelCardList"></div>
  </main>

  <script>
    const LOCAL_FILE = "./japantour.xlsx";
    const CACHE_KEY = "japan_trip_last_saved_note_v2";
    const TIME_KEY = "japan_trip_last_sync_time_v2";

    // Countdown target:
    // 27/11/2026 00:00 at UTC+7.
    // If you later know the exact flight time, only change this one line.
    const DEPARTURE_DATE = new Date("2026-11-27T00:00:00+07:00").getTime();

    let tripData = [];
    let activeIndex = 0;
    let countdownInterval = null;

    function escapeHTML(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function normalizeLink(value) {
      if (!value) return "";

      let link = String(value).trim();
      if (!link) return "";

      if (
        !link.startsWith("http://") &&
        !link.startsWith("https://")
      ) {
        link = "https://" + link;
      }

      try {
        const url = new URL(link);
        return ["http:", "https:"].includes(url.protocol) ? url.href : "";
      } catch {
        return "";
      }
    }

    function normalizeImageSrc(value) {
      if (!value) return "";

      const src = String(value).trim();
      if (!src) return "";

      // Allow common web/relative image paths.
      if (
        src.startsWith("http://") ||
        src.startsWith("https://") ||
        src.startsWith("./") ||
        src.startsWith("../") ||
        src.startsWith("/")
      ) {
        return src;
      }

      return src;
    }

    function initCountdown() {
      const dayEl = document.getElementById("countDays");
      const hourEl = document.getElementById("countHours");
      const minEl = document.getElementById("countMinutes");
      const secEl = document.getElementById("countSeconds");
      const titleEl = document.getElementById("countdownTitle");

      function updateTimer() {
        const diff = DEPARTURE_DATE - Date.now();

        if (diff <= 0) {
          dayEl.textContent = "0";
          hourEl.textContent = "00";
          minEl.textContent = "00";
          secEl.textContent = "00";
          titleEl.textContent = "Japan trip underway 🌸";

          if (countdownInterval) {
            clearInterval(countdownInterval);
            countdownInterval = null;
          }
          return;
        }

        const days = Math.floor(diff / 86400000);
        const hours = Math.floor((diff % 86400000) / 3600000);
        const mins = Math.floor((diff % 3600000) / 60000);
        const secs = Math.floor((diff % 60000) / 1000);

        dayEl.textContent = String(days);
        hourEl.textContent = String(hours).padStart(2, "0");
        minEl.textContent = String(mins).padStart(2, "0");
        secEl.textContent = String(secs).padStart(2, "0");
      }

      updateTimer();

      if (countdownInterval) {
        clearInterval(countdownInterval);
      }

      countdownInterval = setInterval(updateTimer, 1000);
    }

    function formatCurrentTime() {
      const now = new Date();

      return `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
    }

    function setStatus(text, isReady = true) {
      const el = document.getElementById("syncStatusText");
      const dot = document.querySelector(".status-dot");

      if (el) el.textContent = text;

      if (dot) {
        dot.style.background = isReady ? "#8E2944" : "#F59E0B";
        dot.style.boxShadow = isReady
          ? "0 0 0 4px rgba(142, 41, 68, 0.08)"
          : "0 0 0 4px rgba(245, 158, 11, 0.10)";
      }
    }

    function setSyncing(isSyncing) {
      const btn = document.getElementById("syncBtn");
      if (!btn) return;

      btn.disabled = isSyncing;
      btn.classList.toggle("is-syncing", isSyncing);
    }

    function showLoadingSkeleton() {
      const banner = document.getElementById("dayBanner");
      const cardContainer = document.getElementById("travelCardList");

      if (banner) banner.style.display = "none";

      if (cardContainer) {
        cardContainer.innerHTML = `
          <div class="loading-stack" aria-label="Loading itinerary">
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
          </div>
        `;
      }
    }

    function goToItinerary() {
      const target = document.getElementById("itineraryStart");
      const landing = document.getElementById("countdownScreen");

      if (landing) {
        landing.classList.add("is-leaving");
        setTimeout(() => landing.classList.remove("is-leaving"), 600);
      }

      if (target) {
        target.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
      }
    }

    function init() {
      if ("scrollRestoration" in history) {
        history.scrollRestoration = "manual";
      }

      window.scrollTo(0, 0);
      initCountdown();

      const cached = localStorage.getItem(CACHE_KEY);
      const lastTime = localStorage.getItem(TIME_KEY);

      if (cached) {
        try {
          tripData = JSON.parse(cached);

          if (tripData.length > 0) {
            setStatus(lastTime ? `Updated ${lastTime}` : "Updated", true);
            renderUI();
          } else {
            showLoadingSkeleton();
          }
        } catch (e) {
          showLoadingSkeleton();
        }
      } else {
        showLoadingSkeleton();
      }

      // Background sync after cached content is shown.
      syncOnline(false);
    }

    async function syncOnline(isManual) {
      if (isManual) {
        setStatus("Syncing...", false);
      }

      setSyncing(true);

      let arrayBuffer = null;

      try {
        const res = await fetch(`${LOCAL_FILE}?t=${Date.now()}`, {
          cache: "no-store"
        });

        if (res.ok) {
          arrayBuffer = await res.arrayBuffer();
        }
      } catch (e) {
        // Silent fallback to cache.
      }

      if (arrayBuffer) {
        try {
          const workbook = XLSX.read(arrayBuffer, { type: "array" });
          const sheet =
            workbook.Sheets["2026"] ||
            workbook.Sheets[workbook.SheetNames[0]];

          const rows = XLSX.utils.sheet_to_json(sheet, {
            header: 1,
            defval: "",
            raw: true
          });

          const parsed = parseSheet(rows);

          if (parsed && parsed.length > 0) {
            tripData = parsed;
            activeIndex = Math.min(
              Math.max(activeIndex, 0),
              tripData.length - 1
            );

            const updatedTime = formatCurrentTime();

            localStorage.setItem(CACHE_KEY, JSON.stringify(parsed));
            localStorage.setItem(TIME_KEY, updatedTime);

            renderUI();
            setStatus(`Updated ${updatedTime}`, true);
            setSyncing(false);
            return;
          }
        } catch (err) {
          // Silent fallback to cache.
        }
      }

      const lastTime = localStorage.getItem(TIME_KEY);

      if (tripData.length > 0) {
        setStatus(lastTime ? `Updated ${lastTime}` : "Offline", true);
      } else {
        setStatus("Sync Failed", false);

        const banner = document.getElementById("dayBanner");
        const cardContainer = document.getElementById("travelCardList");

        if (banner) banner.style.display = "none";

        if (cardContainer) {
          cardContainer.innerHTML = `
            <div class="empty-state">
              Could not load <strong>japantour.xlsx</strong>.<br>
              Please check the file path or network connection.
            </div>
          `;
        }
      }

      setSyncing(false);
    }

    function formatTime(val) {
      if (val === null || val === undefined || val === "") return "";

      if (typeof val === "number") {
        let sec = Math.round(val * 86400);
        sec = ((sec % 86400) + 86400) % 86400;

        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);

        return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
      }

      const s = String(val).trim();

      if (/^\d{1,2}:\d{2}:\d{2}$/.test(s)) {
        return s.substring(0, 5);
      }

      return s;
    }

    function extractDayAndDate(headerText, dayIndex) {
      let dayName = `Day ${dayIndex + 1}`;
      let dayDate = "";

      const dayMatch =
        headerText.match(/Day\s*(\d+)/i) ||
        headerText.match(/Ngày\s*(\d+)/i);

      if (dayMatch) {
        dayName = `Day ${dayMatch[1]}`;
      }

      const dateMatch = headerText.match(/(\d{1,2}\/\d{1,2})/);

      if (dateMatch) {
        dayDate = dateMatch[1];
      }

      return { dayName, dayDate };
    }

    function parseSheet(rows) {
      const parsed = [];
      let cur = null;
      let dayCount = 0;

      rows.forEach(r => {
        const c0 = String(r[0] ?? "").trim();
        const c1 = String(r[1] ?? "").trim();
        const c2 = String(r[2] ?? "").trim();
        const c3 = String(r[3] ?? "").trim();
        const c4 = String(r[4] ?? "").trim();
        const c5 = String(r[5] ?? "").trim();

        if (!c0 && !c1 && !c2 && !c3 && !c4 && !c5) return;

        if (
          c0.toLowerCase() === "time" &&
          c1.toLowerCase() === "activity"
        ) {
          return;
        }

        const isDayHeader =
          c0.toLowerCase().startsWith("day ") ||
          c0.toLowerCase().startsWith("ngày ");

        if (isDayHeader && !c1) {
          if (cur) parsed.push(cur);

          const meta = extractDayAndDate(c0, dayCount);

          cur = {
            tabDay: meta.dayName,
            tabDate: meta.dayDate,
            title: c0,
            items: []
          };

          dayCount++;
          return;
        }

        if (cur && (c0 || c1)) {
          cur.items.push({
            time: formatTime(r[0]),
            activity: c1 || "Activity",
            desc: c2,
            note: c3,
            img: c4,
            link: c5
          });
        }
      });

      if (cur) parsed.push(cur);

      return parsed;
    }

    function scrollToActiveTab(idx) {
      const tabsBar = document.getElementById("tabsList");

      if (
        !tabsBar ||
        !tabsBar.children ||
        tabsBar.children.length <= idx
      ) {
        return;
      }

      const targetElement = tabsBar.children[idx];
      if (!targetElement) return;

      const visibleCenter = tabsBar.clientWidth / 2;
      const targetCenter =
        targetElement.offsetLeft + targetElement.offsetWidth / 2;

      const nextLeft = Math.max(
        0,
        targetCenter - visibleCenter
      );

      tabsBar.scrollTo({
        left: nextLeft,
        behavior: "smooth"
      });
    }

    function renderUI() {
      const tabsBar = document.getElementById("tabsList");
      const cardContainer = document.getElementById("travelCardList");
      const bannerTitle = document.getElementById("dayFullTitle");
      const banner = document.getElementById("dayBanner");

      tabsBar.innerHTML = "";

      if (!tripData || tripData.length === 0) {
        banner.style.display = "none";

        cardContainer.innerHTML = `
          <div class="empty-state">
            Preparing itinerary...
          </div>
        `;
        return;
      }

      activeIndex = Math.min(
        Math.max(activeIndex, 0),
        tripData.length - 1
      );

      banner.style.display = "block";

      tripData.forEach((day, idx) => {
        const tabBtn = document.createElement("div");
        const isActive = idx === activeIndex;

        tabBtn.className = `tab-card ${isActive ? "active" : ""}`;
        tabBtn.setAttribute("role", "tab");
        tabBtn.setAttribute("aria-selected", String(isActive));
        tabBtn.setAttribute("tabindex", isActive ? "0" : "-1");

        const dateHtml = day.tabDate
          ? `<span class="tab-date-label">${escapeHTML(day.tabDate)}</span>`
          : "";

        tabBtn.innerHTML = `
          <span class="tab-day-label">${escapeHTML(day.tabDay)}</span>
          ${dateHtml}
        `;

        tabBtn.onclick = () => {
          activeIndex = idx;
          renderUI();
        };

        tabsBar.appendChild(tabBtn);
      });

      requestAnimationFrame(() => {
        scrollToActiveTab(activeIndex);
      });

      const activeDay = tripData[activeIndex];

      if (!activeDay) return;

      bannerTitle.textContent = activeDay.title;
      cardContainer.innerHTML = "";

      if (!activeDay.items || activeDay.items.length === 0) {
        cardContainer.innerHTML = `
          <div class="empty-state">
            No activities added for this day yet.
          </div>
        `;
        return;
      }

      activeDay.items.forEach((item, itemIndex) => {
        const card = document.createElement("article");
        card.className = "travel-card";

        const displayTime = item.time
          ? `◷ ${escapeHTML(item.time)}`
          : "◷ All Day";

        let mediaHtml = "";
        const imgSrc = normalizeImageSrc(item.img);

        if (imgSrc) {
          mediaHtml = `
            <div class="card-media">
              <img
                src="${escapeHTML(imgSrc)}"
                loading="lazy"
                decoding="async"
                alt="${escapeHTML(item.activity)}"
              >
            </div>
          `;
        }

        const descHtml = item.desc
          ? `<div class="card-desc">${escapeHTML(item.desc)}</div>`
          : "";

        let linkPill = "";

        if (item.note) {
          const validLink = normalizeLink(item.link);

          if (validLink) {
            linkPill = `
              <a
                href="${escapeHTML(validLink)}"
                target="_blank"
                rel="noopener noreferrer"
                class="pill-link"
              >
                <span>⌖</span>
                <span>${escapeHTML(item.note)}</span>
                <span>↗</span>
              </a>
            `;
          } else {
            linkPill = `
              <span class="pill-note-only">
                <span>⌖</span>
                <span>${escapeHTML(item.note)}</span>
              </span>
            `;
          }
        }

        const pillsContainerHtml = linkPill
          ? `<div class="meta-pills">${linkPill}</div>`
          : "";

        card.innerHTML = `
          <div class="card-inner">
            <div class="card-topline">
              <span class="soft-time-badge">${displayTime}</span>
              <span class="card-seq">
                Stop ${String(itemIndex + 1).padStart(2, "0")}
              </span>
            </div>

            ${mediaHtml}

            <div class="card-body">
              <div class="card-title">
                ${escapeHTML(item.activity)}
              </div>

              ${descHtml}
              ${pillsContainerHtml}
            </div>
          </div>
        `;

        cardContainer.appendChild(card);
      });
    }

    window.addEventListener("pageshow", (event) => {
      if (event.persisted) {
        window.scrollTo(0, 0);
      }
    });

    init();
  </script>
</body>
</html>

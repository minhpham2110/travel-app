<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Japan Winter Tour 2026</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Japan Winter 2026">

  <link rel="apple-touch-icon" sizes="180x180" href="./sakura.png">
  <link rel="icon" type="image/png" href="./sakura.png">

  <!-- SheetJS -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    @font-face {
      font-family: 'Aptos';
      src: local('Aptos'),
           local('Aptos Display'),
           url('https://cdn.jsdelivr.net/gh/idursun/aptos-font@main/Aptos.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Aptos';
      src: local('Aptos-Bold'),
           local('Aptos Display Bold'),
           url('https://cdn.jsdelivr.net/gh/idursun/aptos-font@main/Aptos-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Aptos';
      src: local('Aptos-SemiBold'),
           url('https://cdn.jsdelivr.net/gh/idursun/aptos-font@main/Aptos-SemiBold.ttf') format('truetype');
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --primary: #901f3b;
      --primary-gradient: linear-gradient(180deg, #a52443 0%, #901f3b 100%);
      --primary-soft: rgba(253, 242, 244, 0.85);
      --primary-border: rgba(249, 213, 219, 0.9);

      /* iOS Liquid Glass Tokens */
      --bg: #F2F5F8;
      --liquid-glass-bg: linear-gradient(145deg, rgba(255, 255, 255, 0.82) 0%, rgba(255, 255, 255, 0.58) 100%);
      --liquid-glass-border: rgba(255, 255, 255, 0.95);
      --liquid-glass-shadow: 
        inset 0 1px 1.5px 0 rgba(255, 255, 255, 0.95),
        inset 0 -1px 1px 0 rgba(0, 0, 0, 0.02),
        0 8px 24px -4px rgba(15, 23, 42, 0.06),
        0 2px 6px -1px rgba(15, 23, 42, 0.03);

      --text-main: #0F172A;
      --text-sub: #64748B;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Aptos', -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; 
    }
    
    body { 
      background-color: var(--bg);
      color: var(--text-main); 
      padding-bottom: 70px; 
      -webkit-tap-highlight-color: transparent; 
      min-height: 100vh;
    }

    /* Floating Island Header with iOS Liquid Glass */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: calc(env(safe-area-inset-top, 20px) + 8px) 14px 6px;
      background: rgba(242, 245, 248, 0.75);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
    }
    .header-island {
      background: var(--liquid-glass-bg);
      border: 1px solid var(--liquid-glass-border);
      box-shadow: var(--liquid-glass-shadow);
      border-radius: 22px;
      padding: 11px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .header-info { text-align: left; }
    .header-subtext {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    .header-title { 
      font-size: 16px; 
      font-weight: 700; 
      color: var(--primary);
      letter-spacing: 0.3px; 
      line-height: 1.25;
      margin-top: 1px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sync-pill {
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: 20px;
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 600;
      border: 1px solid var(--primary-border);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.8);
      white-space: nowrap;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--primary);
      flex-shrink: 0;
    }

    .refresh-btn {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.95) 0%, rgba(245, 247, 250, 0.8) 100%);
      border: 1px solid rgba(255, 255, 255, 0.9);
      color: var(--primary);
      padding: 6px 13px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: inset 0 1px 1px #FFFFFF, 0 2px 6px rgba(15, 23, 42, 0.04);
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .refresh-btn:active {
      transform: scale(0.95);
      background: var(--primary-soft);
    }

    /* Countdown Pill Banner */
    .countdown-wrapper {
      padding: 4px 14px 8px;
      max-width: 520px;
      margin: 0 auto;
    }
    .countdown-card {
      background: var(--liquid-glass-bg);
      border: 1px solid var(--liquid-glass-border);
      box-shadow: var(--liquid-glass-shadow);
      border-radius: 16px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .countdown-left {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-sub);
    }
    .countdown-timer {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 0.3px;
      font-variant-numeric: tabular-nums;
    }

    /* iOS Segmented Track Tabs */
    .tabs-bar-wrapper {
      position: sticky;
      top: calc(env(safe-area-inset-top, 20px) + 64px);
      z-index: 99;
      padding: 4px 14px 10px;
      background: rgba(242, 245, 248, 0.75);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
    }
    .tabs-bar {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0.4) 100%);
      border: 1px solid var(--liquid-glass-border);
      box-shadow: inset 0 1px 1.5px rgba(255, 255, 255, 0.9), 0 3px 12px rgba(15, 23, 42, 0.03);
      border-radius: 20px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding: 5px 6px;
      display: flex;
      gap: 6px;
      scroll-behavior: smooth;
      position: relative;
    }
    .tabs-bar::-webkit-scrollbar { display: none; }

    .tab-card {
      background: transparent;
      border: 1px solid transparent;
      padding: 6px 14px;
      border-radius: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      min-width: 68px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .tab-day-label {
      font-size: 12.5px;
      font-weight: 700;
      color: #475569;
      line-height: 1.2;
    }
    .tab-date-label {
      font-size: 10px;
      font-weight: 500;
      color: #94A3B8;
      margin-top: 2px;
      line-height: 1;
    }

    /* Active Tab */
    .tab-card.active {
      background: var(--primary-gradient);
      box-shadow: 
        inset 0 1px 1px rgba(255, 255, 255, 0.35),
        0 4px 14px rgba(144, 31, 59, 0.38);
      transform: scale(1.02);
    }
    .tab-card.active .tab-day-label {
      color: #FFFFFF;
    }
    .tab-card.active .tab-date-label {
      color: #FCE4EC;
    }

    /* Content Area */
    .content-box { 
      max-width: 520px; 
      margin: 0 auto; 
      padding: 8px 14px; 
    }

    .day-banner {
      margin-bottom: 14px;
      padding: 2px 4px;
    }
    .day-banner-title { 
      font-size: 15px; 
      font-weight: 700; 
      color: #334155; 
      line-height: 1.4; 
    }

    /* Travel Card */
    .travel-card {
      background: var(--liquid-glass-bg);
      border-radius: 26px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: var(--liquid-glass-shadow);
      border: 1px solid var(--liquid-glass-border);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      display: flex;
      flex-direction: column;
    }

    /* Soft Liquid Time Badge */
    .time-badge-wrapper {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }
    .soft-time-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--primary-soft);
      border: 1px solid var(--primary-border);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.8);
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 12px;
      letter-spacing: 0.2px;
    }

    /* 16:9 Image */
    .card-media {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 18px;
      overflow: hidden;
      background: #E2E8F0;
      margin-bottom: 12px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
    }
    .card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Card Details */
    .card-body {
      padding: 0 2px;
    }
    .card-title {
      font-size: 16.5px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
      line-height: 1.35;
    }
    .card-desc {
      font-size: 13.5px;
      color: var(--text-sub);
      line-height: 1.55;
      margin-bottom: 14px;
    }

    /* Liquid Pill Action Buttons */
    .meta-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .pill-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.95) 0%, rgba(245, 248, 252, 0.85) 100%);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: inset 0 1px 1px #FFFFFF, 0 2px 6px rgba(15, 23, 42, 0.04);
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 14px;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .pill-link:active {
      background: var(--primary-soft);
      border-color: var(--primary-border);
      transform: scale(0.97);
    }
    .pill-note-only {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.85);
      color: #475569;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 14px;
    }
  </style>
</head>
<body>

  <!-- Floating Island Header -->
  <header>
    <div class="header-island">
      <div class="header-info">
        <div class="header-subtext">Winter Itinerary</div>
        <div class="header-title">JAPAN TOUR 2026</div>
      </div>
      <div class="header-actions">
        <div class="sync-pill" id="syncStatus">
          <span class="status-dot"></span>
          <span id="syncStatusText">Ready</span>
        </div>
        <button class="refresh-btn" onclick="syncOnline(true)">Sync ⟳</button>
      </div>
    </div>
  </header>

  <!-- Live Countdown Banner -->
  <div class="countdown-wrapper">
    <div class="countdown-card">
      <div class="countdown-left">
        <span>✈️</span>
        <span id="countdownLabel">Departure in:</span>
      </div>
      <div class="countdown-timer" id="countdownValue">--d --h --m --s</div>
    </div>
  </div>

  <!-- Segmented Tabs -->
  <div class="tabs-bar-wrapper">
    <div class="tabs-bar" id="tabsList"></div>
  </div>

  <!-- Content Container -->
  <div class="content-box">
    <div class="day-banner" id="dayBanner">
      <div class="day-banner-title" id="dayFullTitle"></div>
    </div>
    <div id="travelCardList"></div>
  </div>

  <script>
    const LOCAL_FILE = "./japantour.xlsx";
    const CACHE_KEY = "japan_trip_last_saved_note_v1";
    const TIME_KEY = "japan_trip_last_sync_time_v1";

    const DEPARTURE_DATE = new Date("2026-11-27T00:00:00+07:00").getTime();

    let tripData = [];
    let activeIndex = 0;

    function initCountdown() {
      const timerEl = document.getElementById("countdownValue");
      const labelEl = document.getElementById("countdownLabel");

      function updateTimer() {
        const now = new Date().getTime();
        const diff = DEPARTURE_DATE - now;

        if (diff <= 0) {
          labelEl.innerText = "Tour Status:";
          timerEl.innerText = "🌸 In Japan Underway!";
          return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const secs = Math.floor((diff % (1000 * 60)) / 1000);

        timerEl.innerText = `${days}d • ${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }

      updateTimer();
      setInterval(updateTimer, 1000);
    }

    function formatCurrentTime() {
      const now = new Date();
      return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }

    function setStatus(text, isReady = true) {
      const el = document.getElementById("syncStatusText");
      const dot = document.querySelector(".status-dot");
      if (el) el.innerText = text;
      if (dot) dot.style.background = isReady ? "#901F3B" : "#F59E0B";
    }

    function init() {
      initCountdown();
      
      // Load cache ngay lập tức để render siêu tốc (<0.1s)
      const cached = localStorage.getItem(CACHE_KEY);
      const lastTime = localStorage.getItem(TIME_KEY);
      if (cached) {
        try { 
          tripData = JSON.parse(cached); 
          setStatus(lastTime ? `Updated ${lastTime}` : "Updated", true);
          renderUI();
        } catch(e) {}
      }
      
      // Đồng bộ ngầm trong nền
      syncOnline(false);
    }

    async function syncOnline(isManual) {
      if (isManual) setStatus("Syncing...", false);

      let arrayBuffer = null;
      try {
        // Thêm timestamp chống browser cache file excel
        let res = await fetch(`${LOCAL_FILE}?t=${Date.now()}`);
        if (res.ok) arrayBuffer = await res.arrayBuffer();
      } catch (e) {}

      if (arrayBuffer) {
        try {
          const workbook = XLSX.read(arrayBuffer, { type: 'array' });
          const sheet = workbook.Sheets["2026"] || workbook.Sheets[workbook.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
          const parsed = parseSheet(rows);
          if (parsed && parsed.length > 0) {
            tripData = parsed;
            const updatedTime = formatCurrentTime();
            localStorage.setItem(CACHE_KEY, JSON.stringify(parsed));
            localStorage.setItem(TIME_KEY, updatedTime);
            renderUI();
            setStatus(`Updated ${updatedTime}`, true);
            return;
          }
        } catch(err) {}
      }

      const lastTime = localStorage.getItem(TIME_KEY);
      if (tripData.length > 0) {
        setStatus(lastTime ? `Updated ${lastTime}` : "Offline Mode", true);
      } else {
        setStatus("Sync Failed", false);
      }
    }

    function formatTime(val) {
      if (!val) return "";
      if (typeof val === 'number') {
        let sec = Math.round(val * 86400);
        let h = Math.floor(sec / 3600);
        let m = Math.floor((sec % 3600) / 60);
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
      }
      let s = String(val).trim();
      return (s.includes(":") && s.length === 8) ? s.substring(0, 5) : s;
    }

    function extractDayAndDate(headerText, dayIndex) {
      let dayName = `Day ${dayIndex + 1}`;
      let dayDate = "";

      let dayMatch = headerText.match(/Day\s*(\d+)/i) || headerText.match(/Ngày\s*(\d+)/i);
      if (dayMatch) dayName = `Day ${dayMatch[1]}`;

      let dateMatch = headerText.match(/(\d{1,2}\/\d{1,2})/);
      if (dateMatch) dayDate = dateMatch[1];

      return { dayName, dayDate };
    }

    function parseSheet(rows) {
      let parsed = [];
      let cur = null;
      let dayCount = 0;

      rows.forEach(r => {
        const c0 = String(r[0] || "").trim();
        const c1 = String(r[1] || "").trim();
        const c2 = String(r[2] || "").trim();
        const c3 = String(r[3] || "").trim();
        const c4 = String(r[4] || "").trim();
        const c5 = String(r[5] || "").trim();

        if (!c0 && !c1 && !c2 && !c3) return;
        if (c0.toLowerCase() === "time" && c1.toLowerCase() === "activity") return;

        if ((c0.toLowerCase().startsWith("day ") || c0.toLowerCase().startsWith("ngày ")) && (!c1 || c1 === "undefined")) {
          if (cur) parsed.push(cur);
          const meta = extractDayAndDate(c0, dayCount);
          cur = { 
            tabDay: meta.dayName,
            tabDate: meta.dayDate,
            title: c0, 
            items: [] 
          };
          dayCount++;
          return;
        }

        if (cur && (c0 || c1)) {
          cur.items.push({
            time: formatTime(c0),
            activity: c1 || "Activity",
            desc: c2,
            note: c3,
            img: c4,
            link: c5
          });
        }
      });

      if (cur) parsed.push(cur);
      return parsed;
    }

    // Auto-Scroll Logic: Day 1-4 locked left, Day 5-6 shift, Day 7-9 locked right
    function scrollToActiveTab(idx) {
      const tabsBar = document.getElementById("tabsList");
      if (!tabsBar || !tabsBar.children || tabsBar.children.length <= idx) return;
      const targetElement = tabsBar.children[idx];
      if (!targetElement) return;

      if (idx <= 3) {
        tabsBar.scrollTo({ left: 0, behavior: 'smooth' });
      } else if (idx >= tripData.length - 3) {
        tabsBar.scrollTo({ left: tabsBar.scrollWidth, behavior: 'smooth' });
      } else {
        const offset = targetElement.offsetLeft - tabsBar.offsetLeft - 8;
        tabsBar.scrollTo({ left: Math.max(0, offset), behavior: 'smooth' });
      }
    }

    function renderUI() {
      const tabsBar = document.getElementById("tabsList");
      const cardContainer = document.getElementById("travelCardList");
      const bannerTitle = document.getElementById("dayFullTitle");
      const banner = document.getElementById("dayBanner");

      tabsBar.innerHTML = "";

      if (!tripData || tripData.length === 0) {
        banner.style.display = "none";
        cardContainer.innerHTML = `<div style="text-align:center;padding:60px 20px;color:var(--text-sub);font-size:14px;">Preparing itinerary...</div>`;
        return;
      }

      banner.style.display = "block";

      tripData.forEach((day, idx) => {
        const tabBtn = document.createElement("div");
        const isActive = (idx === activeIndex);
        tabBtn.className = `tab-card ${isActive ? "active" : ""}`;
        
        const dateHtml = day.tabDate ? `<span class="tab-date-label">${day.tabDate}</span>` : "";
        tabBtn.innerHTML = `
          <span class="tab-day-label">${day.tabDay}</span>
          ${dateHtml}
        `;
        
        tabBtn.onclick = () => {
          activeIndex = idx;
          renderUI();
        };
        tabsBar.appendChild(tabBtn);
      });

      requestAnimationFrame(() => {
        setTimeout(() => {
          scrollToActiveTab(activeIndex);
        }, 30);
      });

      const activeDay = tripData[activeIndex];
      if (activeDay) {
        bannerTitle.innerText = activeDay.title;
        cardContainer.innerHTML = "";

        activeDay.items.forEach(item => {
          const card = document.createElement("div");
          card.className = "travel-card";

          const displayTime = item.time ? `⏰ ${item.time}` : `⏰ All Day`;

          const timeBadgeHtml = `
            <div class="time-badge-wrapper">
              <span class="soft-time-badge">${displayTime}</span>
            </div>
          `;

          let mediaHtml = "";
          if (item.img) {
            mediaHtml = `
              <div class="card-media">
                <img src="${item.img}" loading="lazy" decoding="async" alt="${item.activity}" />
              </div>
            `;
          }

          const descHtml = item.desc ? `<div class="card-desc">${item.desc}</div>` : "";

          let linkPill = "";
          if (item.note) {
            if (item.link) {
              let validLink = item.link.trim();
              if (!validLink.startsWith("http://") && !validLink.startsWith("https://")) {
                validLink = "https://" + validLink;
              }
              linkPill = `<a href="${validLink}" target="_blank" rel="noopener noreferrer" class="pill-link">📍 ${item.note} ↗</a>`;
            } else {
              linkPill = `<span class="pill-note-only">📍 ${item.note}</span>`;
            }
          }

          const pillsContainerHtml = linkPill ? `<div class="meta-pills">${linkPill}</div>` : "";

          card.innerHTML = `
            ${timeBadgeHtml}
            ${mediaHtml}
            <div class="card-body">
              <div class="card-title">${item.activity}</div>
              ${descHtml}
              ${pillsContainerHtml}
            </div>
          `;
          cardContainer.appendChild(card);
        });
      }
    }

    init();
  </script>
</body>
</html>

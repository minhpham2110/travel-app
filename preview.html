<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Japan Winter Tour 2026</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Japan Winter 2026">

  <!-- Biểu tượng icon ứng dụng dạng PNG chuẩn cho iPhone -->
  <link rel="apple-touch-icon" sizes="180x180" href="./sakura.png">
  <link rel="icon" type="image/png" href="./sakura.png">

  <!-- Thư viện SheetJS đọc file Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    /* Nhúng font Aptos */
    @font-face {
      font-family: 'Aptos';
      src: local('Aptos'),
           url('https://cdn.jsdelivr.net/gh/idursun/aptos-font@main/Aptos.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Aptos';
      src: local('Aptos-Bold'),
           url('https://cdn.jsdelivr.net/gh/idursun/aptos-font@main/Aptos-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }

    :root {
      --primary: #901f3b;               /* Đỏ rượu chủ đạo */
      --primary-gradient: linear-gradient(135deg, #901f3b 0%, #b83252 100%);
      --accent: #901f3b;
      --accent-soft: #F9EBEF;
      --bg: #F8F9FA;
      --card-bg: #FFFFFF;
      --text-main: #2B2D42;
      --text-sub: #6C757D;
      --border: #EDE0E4;
      --tag-flight: #3D5A80;
      --tag-food: #D00000;
      --tag-hotel: #5C3D75;
      --tag-sight: #901f3b;
      --link-color: #1976D2;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Aptos', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }
    body { background-color: var(--bg); color: var(--text-main); padding-bottom: 50px; -webkit-tap-highlight-color: transparent; }

    header {
      background: var(--primary-gradient);
      color: white;
      padding: calc(env(safe-area-inset-top, 20px) + 12px) 16px 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(144, 31, 59, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-info { text-align: left; }
    .header-title { font-size: 17px; font-weight: 700; letter-spacing: 0.3px; }
    .sync-badge {
      font-size: 11px;
      display: inline-block;
      margin-top: 3px;
      padding: 2px 8px;
      border-radius: 10px;
      background: rgba(255,255,255,0.22);
    }
    .refresh-btn {
      background: rgba(255,255,255,0.25);
      border: 1px solid rgba(255,255,255,0.4);
      color: white;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .tabs-bar {
      background: #FFFFFF;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: calc(env(safe-area-inset-top, 20px) + 57px);
      z-index: 99;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding: 10px 14px;
      display: flex;
      gap: 8px;
    }
    .tabs-bar::-webkit-scrollbar { display: none; }

    .tab-item {
      background: #F1F3F5;
      border: 1px solid transparent;
      padding: 8px 16px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }
    .tab-item.active {
      background: var(--primary);
      color: #FFFFFF;
      box-shadow: 0 3px 10px rgba(144, 31, 59, 0.35);
    }

    .content-box { max-width: 550px; margin: 0 auto; padding: 16px; }

    .day-banner {
      background: #FFFFFF;
      border-left: 4px solid var(--primary);
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .day-banner-title { font-size: 14px; font-weight: 700; color: var(--text-main); line-height: 1.4; }

    .timeline { position: relative; padding-left: 18px; }
    .timeline::before {
      content: '';
      position: absolute;
      left: 5px;
      top: 14px;
      bottom: 14px;
      width: 2px;
      background: #E5D5DA;
    }

    .card {
      position: relative;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      border: 1px solid var(--border);
    }
    .card::before {
      content: '';
      position: absolute;
      left: -17px;
      top: 18px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
      border: 2px solid #FFF;
      box-shadow: 0 0 0 1px #E5D5DA;
    }

    .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .card-time {
      background: var(--accent-soft);
      color: var(--primary);
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      text-transform: uppercase;
      color: white;
    }

    .card-name { font-size: 15px; font-weight: 700; color: #1A202C; margin-bottom: 4px; line-height: 1.35; }
    
    /* Description & Note styling */
    .card-desc { font-size: 13px; color: #4A5568; line-height: 1.45; word-break: break-word; }
    
    .card-note { 
      font-size: 13px; 
      color: #4A5568; 
      line-height: 1.45; 
      margin-top: 4px; 
      word-break: break-word; 
    }
    .card-note a {
      color: var(--link-color);
      text-decoration: underline;
      text-underline-offset: 2px;
      font-weight: 500;
      word-break: break-word;
    }
    .card-note a:active { opacity: 0.7; }

    /* Khung ảnh tỷ lệ 1920x1080 (16:9), tự crop chuẩn */
    .card-img-wrapper {
      margin-top: 10px;
      border-radius: 10px;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #ECEFF1;
    }
    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .loading-msg {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-sub);
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-info">
      <div class="header-title">JAPAN WINTER TOUR 2026</div>
      <div class="sync-badge" id="syncStatus">Đang tải lịch trình...</div>
    </div>
    <button class="refresh-btn" onclick="syncOnline(true)">Cập nhật ⟳</button>
  </header>

  <div class="tabs-bar" id="tabsList"></div>

  <div class="content-box">
    <div class="day-banner" id="dayBanner">
      <div class="day-banner-title" id="dayFullTitle"></div>
    </div>
    <div class="timeline" id="timelineCards"></div>
  </div>

  <script>
    const LOCAL_FILE = "./japantour.xlsx";
    const SHAREPOINT_FILE = "https://bscvn-my.sharepoint.com/:x:/g/personal/minhpq_bsc_com_vn/IQCHNDjCKlC5S4w9i-w0x3OiAVVX9bXIhQsYTux5-12K7tg?e=Pbu1oa&download=1";
    const CACHE_KEY = "japan_trip_last_saved_note_v1";

    let tripData = [];
    let activeIndex = 0;

    function init() {
      const cached = localStorage.getItem(CACHE_KEY);
      if (cached) {
        try { 
          tripData = JSON.parse(cached); 
          document.getElementById("syncStatus").innerText = "Đã lưu trong máy ✓";
        } catch(e) { 
          tripData = []; 
        }
      }
      renderUI();
      syncOnline(false);
    }

    async function syncOnline(isManual) {
      const badge = document.getElementById("syncStatus");
      if (isManual) badge.innerText = "Đang kiểm tra...";

      let arrayBuffer = null;
      try {
        let res = await fetch(LOCAL_FILE);
        if (res.ok) arrayBuffer = await res.arrayBuffer();
      } catch (e) {}

      if (!arrayBuffer) {
        try {
          let proxy = "https://api.allorigins.win/raw?url=" + encodeURIComponent(SHAREPOINT_FILE);
          let res = await fetch(proxy);
          if (res.ok) arrayBuffer = await res.arrayBuffer();
        } catch (e) {}
      }

      if (arrayBuffer) {
        try {
          const workbook = XLSX.read(arrayBuffer, { type: 'array' });
          const sheet = workbook.Sheets["2026"] || workbook.Sheets[workbook.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
          const parsed = parseSheet(rows);
          if (parsed && parsed.length > 0) {
            tripData = parsed;
            localStorage.setItem(CACHE_KEY, JSON.stringify(parsed));
            renderUI();
            badge.innerText = "Đã lưu bản mới nhất ✓";
            return;
          }
        } catch(err) {}
      }

      if (tripData.length > 0) {
        badge.innerText = "Chế độ xem Offline ✓";
      } else {
        badge.innerText = "Không tải được file Excel";
      }
    }

    function formatTime(val) {
      if (!val) return "";
      if (typeof val === 'number') {
        let sec = Math.round(val * 86400);
        let h = Math.floor(sec / 3600);
        let m = Math.floor((sec % 3600) / 60);
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
      }
      let s = String(val).trim();
      return (s.includes(":") && s.length === 8) ? s.substring(0, 5) : s;
    }

    function parseSheet(rows) {
      let parsed = [];
      let cur = null;

      rows.forEach(r => {
        const c0 = String(r[0] || "").trim(); // Time
        const c1 = String(r[1] || "").trim(); // Activity
        const c2 = String(r[2] || "").trim(); // Description
        const c3 = String(r[3] || "").trim(); // Note
        const c4 = String(r[4] || "").trim(); // Image
        const c5 = String(r[5] || "").trim(); // Link

        if (!c0 && !c1 && !c2 && !c3) return;
        if (c0.toLowerCase() === "time" && c1.toLowerCase() === "activity") return;

        if ((c0.toLowerCase().startsWith("day ") || c0.toLowerCase().startsWith("ngày ")) && (!c1 || c1 === "undefined")) {
          if (cur) parsed.push(cur);
          let tab = c0.split("—")[0].split(":")[0].trim();
          let m = c0.match(/\d{1,2}\/\d{1,2}/);
          if (m) tab += ` (${m[0]})`;
          cur = { tab: tab, title: c0, items: [] };
          return;
        }

        if (cur && (c0 || c1)) {
          cur.items.push({
            time: formatTime(c0),
            activity: c1 || "Hoạt động",
            desc: c2,
            note: c3,
            img: c4,
            link: c5
          });
        }
      });

      if (cur) parsed.push(cur);
      return parsed;
    }

    function getTagColor(act) {
      let a = (act || "").toLowerCase();
      if (a.includes("flight") || a.includes("transfer") || a.includes("train") || a.includes("bus")) return "var(--tag-flight)";
      if (a.includes("lunch") || a.includes("dinner")) return "var(--tag-food)";
      if (a.includes("hotel") || a.includes("check-in") || a.includes("refresh")) return "var(--tag-hotel)";
      return "var(--tag-sight)";
    }

    function renderUI() {
      const tabsBar = document.getElementById("tabsList");
      const cardContainer = document.getElementById("timelineCards");
      const bannerTitle = document.getElementById("dayFullTitle");
      const banner = document.getElementById("dayBanner");

      tabsBar.innerHTML = "";

      if (!tripData || tripData.length === 0) {
        banner.style.display = "none";
        cardContainer.innerHTML = `<div class="loading-msg">Đang đồng bộ dữ liệu từ Excel...</div>`;
        return;
      }

      banner.style.display = "block";

      tripData.forEach((day, idx) => {
        const btn = document.createElement("button");
        btn.className = `tab-item ${idx === activeIndex ? "active" : ""}`;
        btn.innerText = day.tab;
        btn.onclick = () => {
          activeIndex = idx;
          renderUI();
          btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        };
        tabsBar.appendChild(btn);
      });

      const activeDay = tripData[activeIndex];
      if (activeDay) {
        bannerTitle.innerText = activeDay.title;
        cardContainer.innerHTML = "";

        activeDay.items.forEach(item => {
          const card = document.createElement("div");
          card.className = "card";
          const tagColor = getTagColor(item.activity);
          const timeHtml = item.time ? `<span class="card-time">${item.time}</span>` : `<span class="card-time">Trong ngày</span>`;
          const badgeHtml = `<span class="badge" style="background:${tagColor}">${item.activity}</span>`;

          const descHtml = item.desc ? `<div class="card-desc">${item.desc}</div>` : "";

          let noteHtml = "";
          if (item.note) {
            if (item.link) {
              let validLink = item.link.trim();
              if (!validLink.startsWith("http://") && !validLink.startsWith("https://")) {
                validLink = "https://" + validLink;
              }
              noteHtml = `<div class="card-note"><a href="${validLink}" target="_blank" rel="noopener noreferrer">${item.note} ↗</a></div>`;
            } else {
              noteHtml = `<div class="card-note">${item.note}</div>`;
            }
          }

          let imgHtml = "";
          if (item.img) {
            imgHtml = `<div class="card-img-wrapper"><img src="${item.img}" class="card-img" /></div>`;
          }

          card.innerHTML = `
            <div class="card-head">
              ${timeHtml}
              ${badgeHtml}
            </div>
            <div class="card-name">${item.activity}</div>
            ${descHtml}
            ${noteHtml}
            ${imgHtml}
          `;
          cardContainer.appendChild(card);
        });
      }
    }

    init();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Lịch Trình Du Lịch Nhật Bản 2026</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kamikochi 2026">

  <style>
    :root {
      --primary: #1D3557;
      --accent: #E63946;
      --accent-soft: #FDE8E9;
      --bg: #F4F6F9;
      --card-bg: #FFFFFF;
      --text-main: #1D3557;
      --text-sub: #5A6A85;
      --border: #E8ECEF;
      --tag-done: #2A9D8F;
      --tag-ks: #6A4C93;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); padding-bottom: 50px; -webkit-tap-highlight-color: transparent; }

    /* Header iPhone Style */
    header {
      background: linear-gradient(135deg, #1D3557 0%, #457B9D 100%);
      color: white;
      padding: calc(env(safe-area-inset-top, 20px) + 14px) 16px 14px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      text-align: center;
    }
    .header-title { font-size: 18px; font-weight: 700; letter-spacing: 0.3px; }
    .header-sub { font-size: 12px; opacity: 0.85; margin-top: 3px; font-weight: 400; }

    /* Tabs Bar dạng cuộn ngang */
    .tabs-bar {
      background: #FFFFFF;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: calc(env(safe-area-inset-top, 20px) + 61px);
      z-index: 99;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding: 10px 14px;
      display: flex;
      gap: 8px;
    }
    .tabs-bar::-webkit-scrollbar { display: none; }

    .tab-item {
      background: #EDF2F7;
      border: 1px solid transparent;
      padding: 8px 16px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }
    .tab-item.active {
      background: var(--accent);
      color: #FFFFFF;
      box-shadow: 0 3px 10px rgba(230, 57, 70, 0.3);
    }

    /* Khung nội dung */
    .content-box { max-width: 550px; margin: 0 auto; padding: 16px; }

    /* Tiêu đề ngày */
    .day-banner {
      background: #FFFFFF;
      border-left: 4px solid var(--accent);
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .day-banner-title { font-size: 14px; font-weight: 700; color: var(--text-main); line-height: 1.4; }

    /* Timeline Card */
    .timeline { position: relative; padding-left: 18px; }
    .timeline::before {
      content: '';
      position: absolute;
      left: 5px;
      top: 14px;
      bottom: 14px;
      width: 2px;
      background: #D8E2DC;
    }

    .card {
      position: relative;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      border: 1px solid var(--border);
    }
    .card::before {
      content: '';
      position: absolute;
      left: -17px;
      top: 18px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid #FFF;
      box-shadow: 0 0 0 1px #D8E2DC;
    }

    .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .card-time {
      background: #EBF2F7;
      color: #2B4C6F;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      text-transform: uppercase;
    }
    .badge-done { background: #E8F5E9; color: var(--tag-done); }
    .badge-ks { background: #F3E8FF; color: var(--tag-ks); }
    .badge-other { background: #FFF3CD; color: #856404; }

    .card-name { font-size: 14px; font-weight: 700; color: #1A202C; margin-bottom: 4px; line-height: 1.35; }
    .card-desc { font-size: 12px; color: #4A5568; margin-bottom: 4px; line-height: 1.4; word-break: break-word; }
    .card-desc a { color: var(--accent); text-decoration: underline; }

    .card-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
      font-size: 11px;
    }
    .card-price { font-weight: 700; color: var(--accent); }
    .card-note { color: var(--text-sub); font-style: italic; }
  </style>
</head>

    let activeIndex = 0;

    function renderUI() {
      const tabsBar = document.getElementById("tabsList");
      tabsBar.innerHTML = "";

      tripData.forEach((day, idx) => {
        const btn = document.createElement("button");
        btn.className = `tab-item ${idx === activeIndex ? "active" : ""}`;
        btn.innerText = day.tab;
        btn.onclick = () => {
          activeIndex = idx;
          renderUI();
          btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        };
        tabsBar.appendChild(btn);
      });

      const activeDay = tripData[activeIndex];
      document.getElementById("dayFullTitle").innerText = activeDay.title;

      const cardContainer = document.getElementById("timelineCards");
      cardContainer.innerHTML = "";

      activeDay.items.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";

        let badgeClass = "badge-other";
        if (item.badge === "Done" || item.note === "Done") badgeClass = "badge-done";
        else if (item.badge === "KS") badgeClass = "badge-ks";

        const badgeHtml = item.badge ? `<span class="badge ${badgeClass}">${item.badge}</span>` : "";
        const timeHtml = item.time ? `<span class="card-time">${item.time}</span>` : `<span class="card-time">Trong ngày</span>`;

        let descHtml = "";
        if (item.desc) {
          if (item.desc.startsWith("http")) {
            descHtml = `<div class="card-desc"><a href="${item.desc}" target="_blank">🔗 Mở link thông tin chi tiết</a></div>`;
          } else {
            descHtml = `<div class="card-desc">${item.desc}</div>`;
          }
        }

        let footHtml = "";
        if (item.cost || item.note) {
          footHtml = `
            <div class="card-foot">
              <span class="card-price">${item.cost || ""}</span>
              <span class="card-note">${item.note || ""}</span>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="card-head">
            ${timeHtml}
            ${badgeHtml}
          </div>
          <div class="card-name">${item.name}</div>
          ${descHtml}
          ${footHtml}
        `;
        cardContainer.appendChild(card);
      });
    }

    renderUI();
